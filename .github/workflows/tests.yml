name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # ~2 min 30 en local (26/11/2026) : sans limite, un test bloqué consommait 6 h de minutes Actions.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Vérifier les secrets dans les fichiers suivis
        run: python scripts/verifier_secrets.py
      - run: python -m pytest -q tests
      - run: node --test tests/*.test.mjs
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Tester le réchauffeur Pinnacle
        run: deno test --allow-env supabase/functions/tests/pinnacle-rechauffe_test.ts
