name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Vérifier les secrets dans les fichiers suivis
        run: python scripts/verifier_secrets.py
      - run: python -m pytest -q tests
      - run: node --test tests/*.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tester le réchauffeur Pinnacle
        run: deno test --allow-env supabase/functions/tests/pinnacle-rechauffe_test.ts
