name: Sonde des sources US

# Teste depuis GitHub (sortie aux États-Unis) si DraftKings, Betfair et les sources de scores répondent, sans clé ni compte.
# À lancer à la main (Actions → Sonde des sources US → Run workflow). Rien n'est écrit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/sonde_sources_us.py --detail
