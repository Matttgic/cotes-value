name: Reglement des paris

# Le reglement fonctionne independamment du scan des cotes.
# Les donnees sont mises a jour sur la meme branche, sans ecriture concurrente.
# Secours de scores The Odds API et NHL officielle ; diagnostic des sources.
on:
  schedule:
    - cron: "27 * * * *"
  push:
    branches: [ccr-148b8ccc-phitmr]
    paths:
      - .github/workflows/reglement.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # Serveur « en direct » actif (docs/serveur-direct.md) : il règle lui-même les paris ; GitHub ne doit pas écrire
  # les mêmes paris en même temps.
  garde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      serveur: ${{ steps.serveur.outputs.actif }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/serveur_actif.py
          sparse-checkout-cone-mode: false
      - id: serveur
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "actif=$(python3 scripts/serveur_actif.py --depot "$GITHUB_REPOSITORY")" >> "$GITHUB_OUTPUT"

  reglement:
    needs: garde
    outputs:
      artefact: github-pages-${{ github.run_attempt }}
    if: needs.garde.outputs.serveur != 'oui' && (github.event_name == 'workflow_dispatch' || vars.COLLECTE_AUTO == 'oui')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: donnees
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Charger les donnees actuelles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          bash scripts/cloner_donnees.sh "$url" donnees        # sans les jours passés de cotes/ et opportunites/

      - name: Regler les paris sans scanner les cotes
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          THE_ODDS_API_KEY_1: ${{ secrets.THE_ODDS_API_KEY_1 }}
          THE_ODDS_API_KEY_2: ${{ secrets.THE_ODDS_API_KEY_2 }}
          THE_ODDS_API_KEY_3: ${{ secrets.THE_ODDS_API_KEY_3 }}
          THE_ODDS_API_KEY_4: ${{ secrets.THE_ODDS_API_KEY_4 }}
        run: python scripts/cycle.py --seulement-reglement --reglement auto --donnees donnees --site site

      # Même enregistrement que collecte.yml : même si le règlement a échoué en cours de route (les paris déjà
      # réglés sont gardés), sans jamais ajouter les caches sortis de la branche (mémoire de travail écrite dans
      # « donnees » faute de MEMOIRE_CHEMIN ici, fichiers temporaires), avec reprise d'un push concurrent.
      - name: Enregistrer les paris regles
        if: always()
        run: |
          cd donnees
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in horizon_direct pinnacle_secours_cache smarkets_cache controle; do
            printf '/%s.json.gz\n' "$f" >> .git/info/exclude
          done
          printf '%s\n' /horizon_direct.json /pinnacle_secours_cache.json /smarkets_cache.json '*.tmp' >> .git/info/exclude
          git rm -q --cached --ignore-unmatch horizon_direct.json pinnacle_secours_cache.json smarkets_cache.json
          # --sparse : clone partiel (scripts/cloner_donnees.sh) ; les jours non extraits restent intacts
          git add -A --sparse
          git diff --cached --quiet || git commit -qm "Reglement $(date -u +%FT%TZ)"
          # un cycle de collecte ou un résultat saisi à la main entre-temps : on le reprend avant de pousser.
          # 5 essais espacés de 15, 30, 45 puis 60 s : les 3 essais en 1-2 s échouaient tous sur une erreur serveur
          # passagère de GitHub (5 cycles perdus en 7 jours). Un rebase en conflit est annulé avant l'essai suivant.
          for i in 1 2 3 4 5; do
            git push -q origin donnees && exit 0
            [ "$i" -eq 5 ] && break
            sleep $((i * 15))
            git pull -q --rebase origin donnees || git rebase --abort 2>/dev/null || true
          done
          exit 1

      - uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: true      # .nojekyll, comme la v3
          path: site
          name: github-pages-${{ github.run_attempt }}

  publier:
    needs: reglement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - name: Écarter une interface issue d'un ancien code
        id: fraicheur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dernier=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$dernier" = "$GITHUB_SHA" ]; then
            echo "publier=true" >> "$GITHUB_OUTPUT"
          else
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Publication ignorée : un code plus récent est disponible. Les règlements sont conservés."
          fi
      - uses: actions/deploy-pages@v5
        if: steps.fraicheur.outputs.publier == 'true'
        with:
          artifact_name: ${{ needs.reglement.outputs.artefact }}
