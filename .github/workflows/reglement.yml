name: Reglement des paris

# Le reglement fonctionne independamment du scan des cotes.
# Les donnees sont mises a jour sur la meme branche, sans ecriture concurrente.
# Secours de scores The Odds API et NHL officielle ; diagnostic des sources.
on:
  schedule:
    - cron: "27 * * * *"
  push:
    branches: [ccr-148b8ccc-phitmr]
    paths:
      - .github/workflows/reglement.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  reglement:
    outputs:
      artefact: github-pages-${{ github.run_attempt }}
    if: github.event_name == 'workflow_dispatch' || vars.COLLECTE_AUTO == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: donnees
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Charger les donnees actuelles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone -q --depth 1 --branch donnees "$url" donnees

      - name: Regler les paris sans scanner les cotes
        env:
          PULSESCORE_KEY: ${{ secrets.PULSESCORE_KEY }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          THE_ODDS_API_KEY_1: ${{ secrets.THE_ODDS_API_KEY_1 }}
          THE_ODDS_API_KEY_2: ${{ secrets.THE_ODDS_API_KEY_2 }}
          THE_ODDS_API_KEY_3: ${{ secrets.THE_ODDS_API_KEY_3 }}
          THE_ODDS_API_KEY_4: ${{ secrets.THE_ODDS_API_KEY_4 }}
        run: python scripts/cycle.py --seulement-reglement --reglement auto --donnees donnees --site site

      - name: Enregistrer les paris regles
        run: |
          cd donnees
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "Reglement $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git push -q origin donnees && exit 0
            git pull -q --rebase origin donnees
          done
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

  publier:
    needs: reglement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - name: Écarter une interface issue d'un ancien code
        id: fraicheur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dernier=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$dernier" = "$GITHUB_SHA" ]; then
            echo "publier=true" >> "$GITHUB_OUTPUT"
          else
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Publication ignorée : un code plus récent est disponible. Les règlements sont conservés."
          fi
      - uses: actions/deploy-pages@v4
        if: steps.fraicheur.outputs.publier == 'true'
        with:
          artifact_name: ${{ needs.reglement.outputs.artefact }}
