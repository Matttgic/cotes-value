name: Sonde cotes boostées

# Cherche où et sous quelle forme les bookmakers français publient leurs cotes boostées. Rien n'est écrit.
# À lancer à la main (Actions → Sonde cotes boostées → Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [ccr-e8135335-p1o5bw]
    paths:
      - scripts/sonde_boosts.py
      - .github/workflows/sonde-boosts.yml

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/sonde_boosts.py
