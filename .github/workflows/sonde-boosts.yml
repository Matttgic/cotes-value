name: Sonde cotes boostées

# Cherche où et sous quelle forme les bookmakers français publient leurs cotes boostées. Rien n'est écrit.
# À lancer à la main (Actions → Sonde cotes boostées → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/sonde_boosts.py
