name: Diagnostic des sources de resultats

# Lecture seule : cherche pourquoi les matchs en attente ne trouvent aucun resultat (aucune ecriture de donnees).
on:
  push:
    branches: [ccr-148b8ccc-phitmr]
    paths:
      - .github/workflows/diagnostic-sources.yml
      - scripts/diagnostic_sources.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Charger les donnees actuelles
        run: git clone -q --depth 1 --branch donnees "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" donnees
      - name: Diagnostic
        run: python scripts/diagnostic_sources.py --donnees donnees | tee rapport.txt
      - name: Publier le rapport sur une branche jetable
        run: |
          mkdir -p /tmp/rapport && cp rapport.txt /tmp/rapport/ && cd /tmp/rapport
          git init -q && git checkout -q -b diagnostic-sources
          git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapport.txt && git commit -qm "Rapport de diagnostic"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diagnostic-sources
