name: Collecte et comparaison

# Toutes les 15 minutes, seulement si la variable de dépôt COLLECTE_AUTO vaut « oui »
# (Settings → Secrets and variables → Actions → Variables). À activer avec l'offre PulseScore PRO :
# l'offre gratuite (500 requêtes/mois) ne tient pas un cycle complet toutes les 15 minutes.
#
# GitHub saute ou retarde souvent les tâches planifiées (2 lancements en 16 h constatés) : chaque cycle
# relance donc lui-même le suivant, 15 minutes après son début. La tâche planifiée (toutes les heures) ne
# sert qu'à redémarrer la chaîne si elle s'arrête. Une seule chaîne à la fois : le groupe « collecte » ne
# garde qu'un lancement en attente. Pour arrêter : passer COLLECTE_AUTO à autre chose que « oui ».
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "complet = 4 bookmakers français + Betfair sur 36 h ; test = Winamax + Betclic, foot, 1 page (≈ 4 requêtes)"
        type: choice
        options: [test, complet]
        default: test

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

# Trois tâches : le cycle (collecte, paris, règlement, données), la publication du site, et la relance du
# cycle suivant. La publication a sa propre file : si GitHub Pages bloque (environnement « en attente »,
# constaté le 6/10/2026 pendant 2 heures), la collecte et la chaîne des cycles continuent.
jobs:
  cycle:
    if: github.event_name == 'workflow_dispatch' || vars.COLLECTE_AUTO == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: collecte
      cancel-in-progress: false
    outputs:
      debut: ${{ steps.debut.outputs.debut }}
    steps:
      - name: Heure de début
        id: debut
        run: echo "debut=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Récupérer les données (branche « donnees »)
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads origin donnees >/dev/null; then
            git clone -q --depth 1 --branch donnees "$url" donnees
          else
            mkdir donnees && cd donnees && git init -q -b donnees && git remote add origin "$url"
          fi

      - name: Cycle (collecte, comparaison, paris, règlement, site)
        env:
          PULSESCORE_KEY: ${{ secrets.PULSESCORE_KEY }}
          MODE_COLLECTE: ${{ inputs.mode || vars.MODE_COLLECTE || 'complet' }}
        run: python scripts/cycle.py --donnees donnees --site site

      - name: Enregistrer les données
        run: |
          cd donnees
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -qm "Cycle $(date -u +%FT%TZ)"
          git push -q origin donnees

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: true        # seule la dernière version du site compte
    environment:
      name: github-pages
    steps:
      - name: Publier le site (GitHub Pages)
        uses: actions/deploy-pages@v4

  relancer:
    needs: cycle
    if: always() && vars.COLLECTE_AUTO == 'oui' && needs.cycle.result != 'cancelled' && needs.cycle.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Relancer le cycle suivant (15 minutes après le début de celui-ci)
        env:
          GH_TOKEN: ${{ github.token }}
          DEBUT: ${{ needs.cycle.outputs.debut }}
          DEPOT: ${{ github.repository }}
        run: |
          debut=${DEBUT:-$(date +%s)}
          reste=$(( debut + 900 - $(date +%s) - 30 ))
          if [ "$reste" -gt 0 ]; then sleep "$reste"; fi
          # une seule chaîne : c'est le lancement le plus récent qui relance le suivant.
          # L'API GitHub renvoie parfois une erreur passagère (HTTP 500 le 7/10/2026 à 16:59, chaîne
          # arrêtée 2 h) : jusqu'à 6 essais espacés, en revérifiant à chaque fois qu'aucun lancement plus
          # récent n'existe (une erreur 500 peut quand même avoir créé le lancement).
          for essai in 1 2 3 4 5 6; do
            cree=$(gh api "repos/$DEPOT/actions/runs/${{ github.run_id }}" --jq .created_at || true)
            plus_recents=$(gh run list --repo "$DEPOT" --workflow collecte.yml --limit 20 \
              --json createdAt,conclusion \
              --jq "[.[] | select(.createdAt > \"$cree\") | select(.conclusion != \"cancelled\" and .conclusion != \"skipped\")] | length" || echo erreur)
            if [ -n "$cree" ] && [ "$plus_recents" != erreur ]; then
              if [ "$plus_recents" -gt 0 ]; then echo "Un lancement plus récent continue la chaîne."; exit 0; fi
              if gh workflow run collecte.yml --repo "$DEPOT" --ref "${{ github.ref_name }}" \
                  -f mode="${{ vars.MODE_COLLECTE || 'complet' }}"; then
                echo "Cycle suivant lancé."; exit 0
              fi
            fi
            echo "API GitHub indisponible (essai $essai), nouvel essai dans $((essai * 20)) s"
            sleep $((essai * 20))
          done
          exit 1
