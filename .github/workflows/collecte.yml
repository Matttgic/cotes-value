name: Collecte et comparaison

# Toutes les 5 minutes (règlement horaire avec reprise automatique dans la collecte), seulement si la variable de dépôt COLLECTE_AUTO vaut « oui »
# (Settings → Secrets and variables → Actions → Variables). Les bookmakers français sont lus en direct, sans abonnement.
#
# GitHub saute ou retarde souvent les tâches planifiées (2 lancements en 16 h constatés) : chaque cycle
# relance donc lui-même le suivant, 5 minutes après son début (tout de suite s'il a duré plus). La tâche planifiée (toutes les heures) ne
# sert qu'à redémarrer la chaîne si elle s'arrête. Le groupe « donnees » sérialise collecte et règlement
# afin d'éviter les écritures concurrentes sur la branche « donnees ». Pour arrêter : passer COLLECTE_AUTO à autre chose que « oui ».
on:
  schedule:
    - cron: "7 * * * *"
  # Relance aussi un cycle si le workflow de collecte est corrige sur la branche principale.
  push:
    branches: [ccr-148b8ccc-phitmr]
    paths:
      - .github/workflows/collecte.yml
  workflow_dispatch:
    inputs:
      mode:
        description: "complet = bookmakers français sur 36 h ; test = cycle réduit (horizon 12 h)"
        type: choice
        options: [test, complet]
        default: test

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

# Trois tâches : le cycle (collecte, comparaison, paris, données), la publication du site, et la relance du
# cycle suivant. La publication a sa propre file : si GitHub Pages bloque (environnement « en attente »,
# constaté le 6/10/2026 pendant 2 heures), la collecte et la chaîne des cycles continuent.
jobs:
  cycle:
    if: github.event_name == 'workflow_dispatch' || vars.COLLECTE_AUTO == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: donnees
      queue: max
      cancel-in-progress: false
    outputs:
      artefact: github-pages-${{ github.run_attempt }}
      debut: ${{ steps.debut.outputs.debut }}
    steps:
      - name: Heure de début
        id: debut
        run: echo "debut=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # curl_cffi : WebSocket OlyBet (impersonation Chrome), requis par requirements.txt.
      - run: pip install -r requirements.txt

      - name: Récupérer les données (branche « donnees »)
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code --heads origin donnees >/dev/null; then
            git clone -q --depth 1 --branch donnees "$url" donnees
          else
            mkdir donnees && cd donnees && git init -q -b donnees && git remote add origin "$url"
          fi

      # Dernier bon état de Pinnacle et Polymarket (cotes/reprise.py) : quelques Mo en gzip, gardés dans le cache
      # Actions et non dans la branche « donnees ». Absent (premier cycle, cache évincé) : aucune reprise.
      - name: Restaurer le dernier bon état des références
        uses: actions/cache/restore@v4
        with:
          path: reprise
          key: reprise-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reprise-

      # Mémoire de travail du cycle (cotes/memoire.py) : horizon_direct (cotes PMU, Unibet, Betclic, NetBet gardées
      # entre deux lectures), caches Pinnacle secours et Smarkets, contrôle des intitulés. Gzip, hors de la branche
      # « donnees » (elle grossissait de 256 Mo par jour). Absente (premier cycle, cache évincé après 7 jours sans
      # accès ou au-delà de 10 Go) : démarrage à froid, le cycle relit tout et repart de controle.json (publication horaire).
      - name: Restaurer la mémoire de travail
        uses: actions/cache/restore@v4
        with:
          path: memoire
          key: memoire-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: memoire-

      # Ids des alertes Pushover et webhook déjà envoyées (dédoublonnage, branche « donnees »). Si le push de « donnees »
      # échoue, ces fichiers seraient perdus et les alertes renvoyées au cycle suivant : une copie est aussi gardée
      # dans le cache Actions (toujours sauvegardée), fusionnée ici avec la version de la branche (union des ids).
      - name: Restaurer les alertes déjà envoyées
        uses: actions/cache/restore@v4
        with:
          path: envoyes
          key: envoyes-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: envoyes-

      - name: Fusionner les alertes déjà envoyées
        continue-on-error: true
        run: python scripts/envoyes_secours.py fusionner --donnees donnees --secours envoyes

      - name: Cycle (collecte, comparaison, paris, site)
        env:
          REPRISE_CHEMIN: reprise/derniere_lecture.json.gz
          MEMOIRE_CHEMIN: memoire
          PINNACLE_API_KEY: ${{ secrets.PINNACLE_API_KEY }}
          PINNACLE_RECHAUFFEUR_URL: ${{ secrets.PINNACLE_RECHAUFFEUR_URL }}
          PINNACLE_RECHAUFFEUR_SECRET: ${{ secrets.PINNACLE_RECHAUFFEUR_SECRET }}
          # Âge maximum du cache Pinnacle, en minutes : matchs dans les 2 h, puis les autres (cache de 905 s)
          PINNACLE_AGE_MAX_MIN: ${{ vars.PINNACLE_AGE_MAX_MIN || '10' }}
          PINNACLE_AGE_MAX_LOIN_MIN: ${{ vars.PINNACLE_AGE_MAX_LOIN_MIN || '16' }}
          # Secours Pinnacle (pinnodds) : inactif sans ce secret ; voir docs/pinnacle-secours.md
          PINNODDS_API_KEY: ${{ secrets.PINNODDS_API_KEY }}
          PINNODDS_LIMITE_JOUR: ${{ vars.PINNODDS_LIMITE_JOUR || '90' }}
          PINNODDS_PAUSE_MIN: ${{ vars.PINNODDS_PAUSE_MIN || '30' }}
          PINNODDS_HANDICAPS: ${{ vars.PINNODDS_HANDICAPS || 'non' }}
          # Sports relus chez pinnodds quand Pinnacle ne rend que des cotes de plus de 10 min (« non » coupe)
          PINNACLE_SECOURS_PERIME: ${{ vars.PINNACLE_SECOURS_PERIME || 'football' }}
          # Second secours (PinBook, offre gratuite de 550 requêtes par mois) : inactif sans ce secret
          PINBOOK_API_KEY: ${{ secrets.PINBOOK_API_KEY }}
          PINBOOK_LIMITE_JOUR: ${{ vars.PINBOOK_LIMITE_JOUR || '16' }}
          PINBOOK_PAUSE_MIN: ${{ vars.PINBOOK_PAUSE_MIN || '60' }}
          PINBOOK_SPORTS: ${{ vars.PINBOOK_SPORTS || 'football,tennis,basket' }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          THE_ODDS_API_KEY_1: ${{ secrets.THE_ODDS_API_KEY_1 }}
          THE_ODDS_API_KEY_2: ${{ secrets.THE_ODDS_API_KEY_2 }}
          THE_ODDS_API_KEY_3: ${{ secrets.THE_ODDS_API_KEY_3 }}
          THE_ODDS_API_KEY_4: ${{ secrets.THE_ODDS_API_KEY_4 }}
          # Le cron horaire peut être retardé de plusieurs heures : le cycle prend le relais
          # si le dernier règlement date d'au moins 55 min. Même verrou « donnees ».
          REGLEMENT: auto
          MODE_COLLECTE: ${{ inputs.mode || vars.MODE_COLLECTE || 'complet' }}
          # Smarkets (quota de 60 requêtes par minute, lecture en plusieurs passages) ; variable de dépôt SMARKETS_COLLECTE=non pour couper
          SMARKETS_COLLECTE: ${{ vars.SMARKETS_COLLECTE || 'oui' }}
          # Matchbook, sans clé. direct = paris value ; shadow = lecture seule ; off = aucun appel.
          SOURCE_MATCHBOOK: ${{ vars.SOURCE_MATCHBOOK || 'direct' }}
        # On sauvegarde d'abord les prises, puis on alerte AVANT les résultats et le HTML.
        run: python scripts/cycle.py --reglement non --sans-site --donnees donnees --site site

      - name: Envoyer les nouvelles alertes Chrome
        continue-on-error: true
        env:
          # Webhook Pinnacle 2 : inactif sans ALERTE_WEBHOOK_URL ; l'en-tête de la clé vaut x-api-key par défaut
          ALERTE_WEBHOOK_URL: ${{ secrets.ALERTE_WEBHOOK_URL }}
          ALERTE_WEBHOOK_KEY: ${{ secrets.ALERTE_WEBHOOK_KEY }}
          ALERTE_WEBHOOK_CLE_ENTETE: ${{ vars.ALERTE_WEBHOOK_CLE_ENTETE || 'x-api-key' }}
          # Pushover (envoyé avant Chrome) : inactif sans les deux secrets ET sans stratégie cochée.
          # Stratégies : celles cochées sur le site (fonction cv-notifications redéployée). PUSHOVER_STRATEGIES, si elle est
          # remplie (clés séparées par des virgules, liste : scripts/envoyer_notifications.py --strategies), les remplace.
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_STRATEGIES: ${{ vars.PUSHOVER_STRATEGIES }}
          PUSHOVER_PRIORITY: ${{ vars.PUSHOVER_PRIORITY || '0' }}
        run: python scripts/envoyer_notifications.py --donnees donnees --flux notifications-rapides.json

      # Toujours, même si le push échoue plus bas : un cycle suivant ne renvoie pas les mêmes alertes.
      - name: Copier les alertes déjà envoyées
        if: always()
        continue-on-error: true
        run: python scripts/envoyes_secours.py sauver --donnees donnees --secours envoyes

      - name: Sauver les alertes déjà envoyées
        if: always() && hashFiles('envoyes/*.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: envoyes
          key: envoyes-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Règlement après les alertes et construction du site
        env:
          MEMOIRE_CHEMIN: memoire
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
          THE_ODDS_API_KEY_1: ${{ secrets.THE_ODDS_API_KEY_1 }}
          THE_ODDS_API_KEY_2: ${{ secrets.THE_ODDS_API_KEY_2 }}
          THE_ODDS_API_KEY_3: ${{ secrets.THE_ODDS_API_KEY_3 }}
          THE_ODDS_API_KEY_4: ${{ secrets.THE_ODDS_API_KEY_4 }}
        run: python scripts/cycle.py --seulement-reglement --reglement auto --donnees donnees --site site

      # Un seul commit et un seul push par cycle (collecte, alertes, règlement), même si une étape a échoué.
      # Les caches sortis de la branche ne sont jamais ajoutés ; au premier cycle, ils sont retirés de l'index
      # (git rm --cached) : l'historique de « donnees » n'est pas réécrit.
      - name: Enregistrer les données
        id: enregistrer
        if: always()
        run: |
          cd donnees
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in horizon_direct pinnacle_secours_cache smarkets_cache controle; do
            printf '/%s.json.gz\n' "$f" >> .git/info/exclude
          done
          printf '%s\n' /horizon_direct.json /pinnacle_secours_cache.json /smarkets_cache.json '*.tmp' >> .git/info/exclude
          git rm -q --cached --ignore-unmatch horizon_direct.json pinnacle_secours_cache.json smarkets_cache.json
          git add -A
          git diff --cached --quiet || git commit -qm "Cycle $(date -u +%FT%TZ)"
          # un résultat saisi à la main pendant le cycle (autre fichier) : on le reprend avant de pousser
          for i in 1 2 3; do
            git push -q origin donnees && exit 0
            git pull -q --rebase origin donnees
          done
          exit 1

      # Le dernier bon état des références ne dépend pas de « donnees » (lectures Pinnacle et Polymarket) :
      # gardé même si une étape ou le push a échoué.
      - name: Sauver le dernier bon état des références
        if: always() && hashFiles('reprise/derniere_lecture.json.gz') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: reprise
          key: reprise-${{ github.run_id }}-${{ github.run_attempt }}

      # La mémoire de travail doit rester alignée sur la branche « donnees » : historique_cotes n'ajoute que les
      # cotes qui ont changé depuis la mémoire. Si le push a échoué, sauver la nouvelle mémoire laisserait un trou
      # dans cotes/AAAA-MM-JJ.jsonl.gz ; on ne la sauve donc qu'après un push réussi. Sinon, le cycle suivant
      # restaure la mémoire du dernier push réussi (clé unique par lancement, restore-keys = la plus récente) et
      # réécrit les changements perdus.
      - name: Sauver la mémoire de travail
        if: always() && steps.enregistrer.outcome == 'success' && hashFiles('memoire/*.json.gz') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: memoire
          key: memoire-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

  publier:
    needs: cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false       # ne pas interrompre une publication plus récente
    environment:
      name: github-pages
    steps:
      - name: Écarter une interface issue d'un ancien code
        id: fraicheur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dernier=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$dernier" = "$GITHUB_SHA" ]; then
            echo "publier=true" >> "$GITHUB_OUTPUT"
          else
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Publication ignorée : un code plus récent est disponible. Les données collectées sont conservées."
          fi
      - name: Publier le site (GitHub Pages)
        if: steps.fraicheur.outputs.publier == 'true'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.cycle.outputs.artefact }}

  relancer:
    needs: cycle
    # Une expiration du job cycle doit pouvoir relancer la chaîne ; le watchdog indépendant
    # couvre aussi les annulations du workflow qui empêchent ce job de s'exécuter.
    if: always() && vars.COLLECTE_AUTO == 'oui' && needs.cycle.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Relancer le cycle suivant (5 minutes après le début de celui-ci)
        env:
          GH_TOKEN: ${{ github.token }}
          DEBUT: ${{ needs.cycle.outputs.debut }}
          DEPOT: ${{ github.repository }}
        run: |
          debut=${DEBUT:-$(date +%s)}
          reste=$(( debut + 300 - $(date +%s) - 30 ))
          if [ "$reste" -gt 0 ]; then sleep "$reste"; fi
          # une seule chaîne : c'est le lancement le plus récent qui relance le suivant.
          # L'API GitHub renvoie parfois une erreur passagère (HTTP 500 le 7/10/2026 à 16:59, chaîne
          # arrêtée 2 h) : jusqu'à 6 essais espacés, en revérifiant à chaque fois qu'aucun lancement plus
          # récent n'existe (une erreur 500 peut quand même avoir créé le lancement).
          # Seules les erreurs 5xx et réseau (aucun code HTTP) sont réessayées. Workflow désactivé ou HTTP 422
          # (relance refusée) : arrêt immédiat et propre, rien à réessayer. Autre 4xx : échec immédiat.
          erreur=$(mktemp)
          # 0 = succès ; 10 = arrêt propre ; 11 = échec définitif ; 12 = passager (à réessayer)
          classer() {
            if grep -qiE 'HTTP 422|disabled|désactivé' "$erreur"; then return 10; fi
            if grep -qE 'HTTP 5[0-9][0-9]' "$erreur"; then return 12; fi
            if grep -qE 'HTTP [0-9]{3}' "$erreur"; then return 11; fi
            return 12
          }
          for essai in 1 2 3 4 5 6; do
            code=0
            etat=$(gh api "repos/$DEPOT/actions/workflows/collecte.yml" --jq .state 2>"$erreur") || { classer || code=$?; }
            if [ "$code" -eq 0 ] && [ -n "$etat" ] && [ "$etat" != active ]; then
              echo "Workflow de collecte non actif ($etat) : pas de relance."; exit 0
            fi
            if [ "$code" -eq 0 ]; then
              cree=$(gh api "repos/$DEPOT/actions/runs/${{ github.run_id }}" --jq .created_at 2>"$erreur") || { classer || code=$?; }
              if [ "$code" -eq 0 ] && [ -z "$cree" ]; then code=12; fi
            fi
            if [ "$code" -eq 0 ]; then
              plus_recents=$(gh run list --repo "$DEPOT" --workflow collecte.yml --limit 20 \
                --json createdAt,conclusion \
                --jq "[.[] | select(.createdAt > \"$cree\") | select(.conclusion != \"cancelled\" and .conclusion != \"skipped\")] | length" 2>"$erreur") \
                || { classer || code=$?; }
            fi
            if [ "$code" -eq 0 ]; then
              if [ "$plus_recents" -gt 0 ]; then echo "Un lancement plus récent continue la chaîne."; exit 0; fi
              if gh workflow run collecte.yml --repo "$DEPOT" --ref "${{ github.ref_name }}" \
                  -f mode="${{ vars.MODE_COLLECTE || 'complet' }}" 2>"$erreur"; then
                echo "Cycle suivant lancé."; exit 0
              fi
              classer || code=$?
            fi
            sed -n "1,5s/^/  /p" "$erreur"
            if [ "$code" -eq 10 ]; then echo "Relance refusée (HTTP 422 ou workflow désactivé) : arrêt propre."; exit 0; fi
            if [ "$code" -eq 11 ]; then echo "::error::Relance refusée par l'API GitHub (erreur 4xx, voir ci-dessus)."; exit 1; fi
            echo "API GitHub indisponible (essai $essai), nouvel essai dans $((essai * 20)) s"
            sleep $((essai * 20))
          done
          exit 1
