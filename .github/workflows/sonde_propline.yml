name: Sonde Prop-Line

on:
  workflow_dispatch:
  push:
    branches: [ccr-148b8ccc-phitmr]
    paths: [.github/workflows/sonde_propline.yml]

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Verifier la cle et les scores gratuits
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: python scripts/sonde_propline.py
