name: Audit ponctuel des flux live

on:
  workflow_dispatch:
  push:
    branches: [ccr-148b8ccc-phitmr]
    paths: [.github/workflows/sonde-live.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sonde-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sonder les flux sans modifier les donnees
        env:
          PULSESCORE_KEY: ${{ secrets.PULSESCORE_KEY }}
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: python scripts/sonde_live_pauses.py --sortie /tmp/audit-live.json
      - name: Afficher le diagnostic sans secrets
        run: python -m json.tool /tmp/audit-live.json
      - uses: actions/upload-artifact@v4
        with:
          name: audit-live-${{ github.run_id }}
          path: /tmp/audit-live.json
          retention-days: 7
