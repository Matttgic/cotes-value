name: Publier le site depuis les données enregistrées

on:
  push:
    branches: [ccr-148b8ccc-phitmr]
    paths:
      - scripts/site_web.py
      - cotes/laboratoire.py
      - cotes/simulation.py
      - cotes/convergence.py
      - cotes/strategies_prudentes.py
      - cotes/notifications.py
      - cotes/securite.py
      - web/**
      - cotes/strategie_*.py
      - docs/comparaison-strategies.json
      - docs/strategie-m3.json
      - docs/strategie-jules.json
      - docs/strategie-jules-v2.json
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# La publication d'une évolution du site ne relance pas les API de collecte.
jobs:
  construire:
    outputs:
      artefact: github-pages-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: donnees
          path: donnees
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Construire avec les données existantes
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.site_web import construire
          construire(Path('donnees'), Path('site'))
          PY
      - name: Vérifier la syntaxe JavaScript du site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("site/interface.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
          if len(scripts) != 1:
              raise SystemExit(f"Nombre de scripts inattendu : {len(scripts)}")
          Path("/tmp/cotes-value-site.js").write_text(scripts[0], encoding="utf-8")
          vitrine = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", vitrine)
          Path("/tmp/cotes-value-vitrine.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/cotes-value-site.js
          node --check /tmp/cotes-value-vitrine.js
          node --check site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
  publier:
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - name: Écarter une interface issue d'un ancien code
        id: fraicheur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dernier=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$dernier" = "$GITHUB_SHA" ]; then
            echo "publier=true" >> "$GITHUB_OUTPUT"
          else
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Publication ignorée : un code plus récent est disponible."
          fi
      - uses: actions/deploy-pages@v4
        if: steps.fraicheur.outputs.publier == 'true'
        with:
          artifact_name: ${{ needs.construire.outputs.artefact }}
