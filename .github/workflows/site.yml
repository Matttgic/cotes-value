name: Publier le site depuis les données enregistrées

on:
  push:
    branches: [ccr-148b8ccc-phitmr]
    paths:
      - scripts/site_web.py
      - cotes/site/**
      - cotes/__main__.py
      - cotes/laboratoire.py
      - cotes/simulation.py
      - cotes/convergence.py
      - cotes/strategies_prudentes.py
      - cotes/notifications.py
      - cotes/securite.py
      - web/**
      - cotes/strategie_*.py
      - docs/comparaison-strategies.json
      - docs/strategie-m3.json
      - docs/strategie-jules.json
      - docs/strategie-jules-v2.json
      - .github/workflows/site.yml
  workflow_dispatch:

# Aucun droit par défaut : chaque tâche reçoit seulement les siens (audit du 20/11/2026).
permissions: {}

# La publication d'une évolution du site ne relance pas les API de collecte.
jobs:
  construire:
    outputs:
      artefact: github-pages-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: donnees
          path: donnees
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Construire avec les données existantes
        run: python -m cotes site --donnees donnees --sortie site
      - name: Vérifier la syntaxe JavaScript du site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("site/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html)
          import sys; sys.path.insert(0, ".")
          from cotes.site.construction import THEME_SCRIPT
          if len(scripts) != 2 or scripts[0] != THEME_SCRIPT:
              raise SystemExit(f"Scripts inattendus : {len(scripts)} (thème fixe puis script principal attendus)")
          Path("/tmp/cotes-value-site.js").write_text(scripts[1], encoding="utf-8")
          vitrine = Path("site/vitrine.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", vitrine)
          Path("/tmp/cotes-value-vitrine.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/cotes-value-site.js
          node --check /tmp/cotes-value-vitrine.js
          node --check site/sw.js
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true      # .nojekyll, comme la v3
          path: site
          name: github-pages-${{ github.run_attempt }}
  publier:
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
    steps:
      - name: Écarter une interface issue d'un ancien code
        id: fraicheur
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dernier=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" --jq .sha)
          if [ "$dernier" = "$GITHUB_SHA" ]; then
            echo "publier=true" >> "$GITHUB_OUTPUT"
          else
            echo "publier=false" >> "$GITHUB_OUTPUT"
            echo "Publication ignorée : un code plus récent est disponible."
          fi
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.fraicheur.outputs.publier == 'true'
        with:
          artifact_name: ${{ needs.construire.outputs.artefact }}
