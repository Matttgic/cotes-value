name: Surveillance et reprise de la collecte

# La chaine normale se relance toutes les 5 minutes. Ce garde-fou
# n'interroge PAS les API de cotes si la collecte fonctionne deja.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  verifier:
    if: vars.COLLECTE_AUTO == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: surveillance-collecte
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: scripts/serveur_actif.py
          sparse-checkout-cone-mode: false
      - name: Redemarrer uniquement si la collecte est arretee
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          BRANCHE: ${{ github.event.repository.default_branch }}
          MODE: ${{ vars.MODE_COLLECTE || 'complet' }}
        shell: bash
        run: |
          set -euo pipefail
          # Serveur « en direct » actif (docs/serveur-direct.md) : c'est lui qui collecte, rien à redémarrer.
          if [ "$(python3 scripts/serveur_actif.py --depot "$DEPOT")" = oui ]; then
            echo "Serveur en direct actif : aucune relance."
            exit 0
          fi
          executions=$(gh run list --repo "$DEPOT" --workflow collecte.yml \
            --limit 30 --json databaseId,createdAt,status,conclusion)
          # Un lancement « queued » sans aucun job depuis 10 min est un fantôme GitHub (16/11/2026 : jamais démarré,
          # impossible à annuler) : il ne compte pas comme une collecte active.
          maintenant=$(date -u +%s)
          actives=0
          while read -r id statut cree; do
            [ -n "$id" ] || continue
            if [ "$statut" = queued ] && [ $((maintenant - $(date -u -d "$cree" +%s))) -gt 600 ] \
               && [ "$(gh api "repos/$DEPOT/actions/runs/$id/jobs" --jq .total_count)" = 0 ]; then
              echo "Lancement $id dans la file sans job depuis plus de 10 min : fantôme ignoré."
              continue
            fi
            actives=$((actives + 1))
          done < <(jq -r '.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending" or .status == "requested") | "\(.databaseId) \(.status) \(.createdAt)"' <<<"$executions")
          if [ "$actives" -gt 0 ]; then
            echo "Collecte en cours ou dans la file : aucune relance."
            exit 0
          fi

          derniere=$(jq -r '[.[].createdAt] | max // empty' <<<"$executions")
          if [ -n "$derniere" ]; then
            lancement=$(date -u -d "$derniere" +%s)
            age=$((maintenant - lancement))
            if [ "$age" -lt 900 ]; then
              echo "Derniere collecte lancee il y a ${age}s : delai normal."
              exit 0
            fi
          fi

          echo "Aucune collecte active et aucun lancement depuis 15 minutes : relance."
          gh workflow run collecte.yml --repo "$DEPOT" --ref "$BRANCHE" -f mode="$MODE"
