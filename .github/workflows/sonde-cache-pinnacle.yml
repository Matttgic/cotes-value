name: Sonde cache Pinnacle
# Temporaire (branche sonde-cache-pinnacle) : âge Cloudflare de chaque orthographe d'URL des prix. Rien n'est écrit.
on:
  push:
    branches: [sonde-cache-pinnacle]
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/sonde_cache_pinnacle.py
        env:
          PINNACLE_API_KEY: ${{ secrets.PINNACLE_API_KEY }}
