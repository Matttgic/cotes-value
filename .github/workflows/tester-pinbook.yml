name: Essai PinBook

# À lancer à la main : trois requêtes vers PinBook (Pinnacle via RapidAPI) pour juger couverture et fraîcheur.
# Inactif sans le secret PINBOOK_API_KEY. N'écrit rien dans les données.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: Lire PinBook
        env:
          PINBOOK_API_KEY: ${{ secrets.PINBOOK_API_KEY }}
        run: python scripts/tester_pinbook.py
