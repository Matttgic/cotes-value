<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cotes Value · aperçu responsive</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e9ec;color:#243841;font:13px system-ui}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid #ccd6dc}
header b{margin-right:auto}button{font:inherit;background:#fff;color:#243841;border:1px solid #a9bdc6;border-radius:7px;padding:8px 12px;cursor:pointer;min-height:40px}
button[aria-pressed=true]{background:#096b65;color:#fff;border-color:#096b65}
main{padding:20px;display:flex;justify-content:center;overflow:auto}iframe{border:0;width:390px;height:844px;flex:none;box-shadow:0 8px 32px #24384120;border-radius:12px;color-scheme:light}
</style>
<header><b>Aperçu du site · taille réelle</b>
<button data-largeur="360" aria-pressed="false">360 px</button>
<button data-largeur="390" aria-pressed="true">390 px</button>
<button data-largeur="430" aria-pressed="false">430 px</button>
<button data-largeur="1200" aria-pressed="false">Ordinateur</button>
<button id="theme" aria-pressed="false">Mode sombre</button></header>
<main><iframe title="Cotes Value · aperçu" src="./index.html#jouer"></iframe></main>
<script>
const cadre=document.querySelector('iframe');
for(const b of document.querySelectorAll('[data-largeur]')) b.onclick=()=>{
  cadre.style.width=b.dataset.largeur+'px';
  for(const c of document.querySelectorAll('[data-largeur]')) c.setAttribute('aria-pressed',String(c===b));
};
document.getElementById('theme').onclick=ev=>{
  const sombre=ev.currentTarget.getAttribute('aria-pressed')!=='true';
  ev.currentTarget.setAttribute('aria-pressed',String(sombre));cadre.style.colorScheme=sombre?'dark':'light';
};
</script>
</html>
